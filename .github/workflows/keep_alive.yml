name: Bot Hosting Keep Alive

on:
  schedule:
    # 每天 UTC 03:00 和 15:00 运行两次（对应北京时间 11:00 和 23:00）
    - cron: '0 3,15 * * *'
  workflow_dispatch: # 支持手动点击运行测试

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: 执行保活任务
        env:
          USER_COOKIE: ${{ secrets.USER_COOKIE }}
          BOT_ID: ${{ secrets.BOT_ID }}
        run: |
          python keep_alive.py
